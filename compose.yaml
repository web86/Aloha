name: aloha-local

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: aloha_local
  WORDPRESS_DB_USER: aloha_local
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run ./bin/local init}
  WORDPRESS_DEBUG: '1'
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_DEBUG_DISPLAY', false);
    define('WP_DEBUG_LOG', true);
    define('WP_AUTO_UPDATE_CORE', false);
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('DISABLE_WP_CRON', true);
    define('WP_HTTP_BLOCK_EXTERNAL', true);

services:
  db:
    image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    environment:
      MARIADB_DATABASE: aloha_local
      MARIADB_USER: aloha_local
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run ./bin/local init}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run ./bin/local init}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: 'no'

  wordpress:
    image: wordpress:7.1.3-php8.3-apache@sha256:f3e6835fa7d4a5b786615c24b67ec70816e06ebd517d31276bef423e49dfd126
    ports:
      - '127.0.0.1:8088:80'
    environment: *wordpress-env
    volumes:
      - wordpress:/var/www/html
      - ./config/php-local.ini:/usr/local/etc/php/conf.d/zz-aloha-local.ini:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1/wp-login.php') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: 'no'

  cli:
    image: wordpress:cli-2.12.0-php8.3@sha256:94017f46151918dc886c2d6b3a072ce7912f9a935eb162566af184722a173a04
    profiles: [tools]
    user: '33:33'
    environment:
      <<: *wordpress-env
      WP_ADMIN_USER: ${WP_ADMIN_USER:?Run ./bin/local init}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?Run ./bin/local init}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?Run ./bin/local init}
      WP_CLI_CONFIG_PATH: /etc/aloha/wp-cli.yml
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wordpress:/var/www/html
      - ./config/php-local.ini:/usr/local/etc/php/conf.d/zz-aloha-local.ini:ro
      - ./config/wp-cli.yml:/etc/aloha/wp-cli.yml:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
  wordpress:

networks:
  default:
    # A regular project bridge is needed for OrbStack's loopback port forwarding.
    # DB has no published port; WordPress HTTP clients are blocked in wp-config.
    ipam:
      config:
        - subnet: 10.203.88.0/24
