; Development only. PHP errors go to docker compose logs wordpress.
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
error_reporting = E_ALL
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
; No local mail is delivered to external recipients.
sendmail_path = /bin/true
